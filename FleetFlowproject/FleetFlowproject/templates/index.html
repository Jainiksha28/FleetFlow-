{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FleetFlow | Login</title>
  <link rel="stylesheet" href="{% static 'static/style.css'%}" />
</head>
<body>
  <div class="auth-container">
    <form class="auth-card" id="loginForm">
      <div class="icon-circle">
        <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="user" />
      </div>
      <h2>Welcome Back</h2>
      <p class="subtext">Sign in to your account</p>

      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required>

      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required>

      <label>Select Role</label>
      <select id="loginRole">
        <option value="manager">Manager</option>
        <option value="dispatcher">Dispatcher</option>
        <option value="safety">Safety Officer</option>
        <option value="finance">Financial Analyst</option>
      </select>

      <button type="submit">Sign In</button>

      <a href="#" class="forgot">Forgot your password?</a>
      <p class="switch">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
      <p id="loginMsg"></p>
    </form>
  </div>

  <script src="{static 'static/script.js'}"></script>
</body>
</html>
